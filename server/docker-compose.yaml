name: mem0-dev

services:
  mem0:
    build:
      context: ..
      dockerfile: server/dev.Dockerfile
    restart: unless-stopped
    ports:
      - "8888:8000"
    env_file:
      - .env
    networks:
      - mem0_network
    volumes:
      - mem0_history:/app/history
      - .:/app
      - ../mem0:/opt/mem0-src
    depends_on:
      postgres:
        condition: service_healthy
      # Soft dependency: the graph capability degrades silently when the bridge is down,
      # so mem0 must start regardless of the bridge's health (`required: false` only
      # affects ordering when the bridge was explicitly requested).
      graph-bridge:
        condition: service_started
        required: false
    command: >
      sh -c "rm -rf /usr/local/lib/python3.12/site-packages/mem0 && cp -r /opt/mem0-src /usr/local/lib/python3.12/site-packages/mem0 && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - DASHBOARD_URL=http://localhost:3000
      - APP_DB_NAME=mem0_app
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - MEM0_TELEMETRY=${MEM0_TELEMETRY:-true}
      # Retrieval decay knobs (optional): unset means the SDK defaults are used, and
      # `enabled=false` keeps retrieval byte-identical to pre-decay releases.
      - MEM0_DECAY_ENABLED=${MEM0_DECAY_ENABLED:-false}
      - MEM0_DECAY_HALFLIFE_DAYS=${MEM0_DECAY_HALFLIFE_DAYS:-}
      - MEM0_DECAY_STRENGTH_STEP_DAYS=${MEM0_DECAY_STRENGTH_STEP_DAYS:-}
      - MEM0_DECAY_ACCESS_CAP=${MEM0_DECAY_ACCESS_CAP:-}
      - MEM0_DECAY_FLOOR=${MEM0_DECAY_FLOOR:-}
      - MEM0_DECAY_COOLDOWN_SECONDS=${MEM0_DECAY_COOLDOWN_SECONDS:-}
      # Dream (background memory synthesis). Off by default: it writes new records, so it
      # never turns itself on during an upgrade. `DREAM_ENABLED=true` starts the periodic
      # thread and enables POST /dream/run and POST /dream/preview (409 while disabled).
      - DREAM_ENABLED=${DREAM_ENABLED:-false}
      - DREAM_INTERVAL_SECONDS=${DREAM_INTERVAL_SECONDS:-}
      - DREAM_INITIAL_DELAY_SECONDS=${DREAM_INITIAL_DELAY_SECONDS:-}
      - DREAM_RUN_TIMEOUT_SECONDS=${DREAM_RUN_TIMEOUT_SECONDS:-}
      - DREAM_PER_CLUSTER_TIMEOUT_SECONDS=${DREAM_PER_CLUSTER_TIMEOUT_SECONDS:-}
      - DREAM_REPORT_DIR=${DREAM_REPORT_DIR:-}
      # Graph memory (Graphiti side-car graph). Off by default: no dispatch, no graph
      # query, no boost -- retrieval stays byte-identical to pre-graph releases.
      - MEM0_GRAPH_ENABLED=${MEM0_GRAPH_ENABLED:-false}
      - MEM0_GRAPH_ENDPOINT=${MEM0_GRAPH_ENDPOINT:-http://graph-bridge:8000}
      - MEM0_GRAPH_WEIGHT=${MEM0_GRAPH_WEIGHT:-}
      - MEM0_GRAPH_MAX_FACTS=${MEM0_GRAPH_MAX_FACTS:-}
      - MEM0_GRAPH_TIMEOUT_SECONDS=${MEM0_GRAPH_TIMEOUT_SECONDS:-}
      - MEM0_GRAPH_INCLUDE_INVALIDATED=${MEM0_GRAPH_INCLUDE_INVALIDATED:-}
      - MEM0_GRAPH_QUEUE_SIZE=${MEM0_GRAPH_QUEUE_SIZE:-}
      - MEM0_GRAPH_MAX_RETRIES=${MEM0_GRAPH_MAX_RETRIES:-}
      - MEM0_GRAPH_RETRY_BACKOFF_SECONDS=${MEM0_GRAPH_RETRY_BACKOFF_SECONDS:-}
      - MEM0_GRAPH_CIRCUIT_BREAKER_FAILURES=${MEM0_GRAPH_CIRCUIT_BREAKER_FAILURES:-}
      - MEM0_GRAPH_CIRCUIT_COOLDOWN_SECONDS=${MEM0_GRAPH_CIRCUIT_COOLDOWN_SECONDS:-}
      - MEM0_GRAPH_REQUEST_TIMEOUT_SECONDS=${MEM0_GRAPH_REQUEST_TIMEOUT_SECONDS:-}

  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    networks:
      - mem0_network
    # Internal-only: no host port published (the graph is reached through the bridge).
    mem_limit: 384m
    volumes:
      - falkordb_data:/data

  graph-bridge:
    build: ./graph-bridge
    restart: unless-stopped
    networks:
      - mem0_network
    mem_limit: 512m
    env_file:
      - .env
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      # 抽取管道按 OpenAI 兼容的 /chat/completions 通道装配（`response_format` 用
      # json_object：本机网关对 json_schema 回 422，实测见方案 §10 的 E7/E18）；
      # LLM_MODEL 缺省跟随后端默认 LLM 模型。
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${GRAPH_LLM_MODEL:-${MEM0_DEFAULT_LLM_MODEL:-gpt-5-mini}}
      - EMBEDDER_API_KEY=${EMBEDDER_API_KEY:-}
      - EMBEDDER_BASE_URL=${EMBEDDER_BASE_URL:-}
      - EMBEDDER_MODEL=${MEM0_DEFAULT_EMBEDDER_MODEL:-text-embedding-3-small}
      - EMBEDDER_DIMS=${EMBEDDER_EMBEDDING_DIMS:-2048}
      - SEMAPHORE_LIMIT=1
    depends_on:
      - falkordb

  postgres:
      image: pgvector/pgvector:pg17
      restart: unless-stopped
      shm_size: "128mb"
      networks:
        - mem0_network
      environment:
        - POSTGRES_USER=${POSTGRES_USER:-postgres}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -q -d postgres -U ${POSTGRES_USER:-postgres}"]
        interval: 5s
        timeout: 5s
        retries: 5
      volumes:
        - postgres_db:/var/lib/postgresql/data
        - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      ports:
        - "8432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    networks:
      - mem0_network
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  mem0-dashboard:
    build: ./dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - mem0_network
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8888
      - API_INTERNAL_URL=http://mem0:8000
      - NEXT_PUBLIC_INSTANCE_NAME=Mem0
    depends_on:
      mem0:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_db:
  mem0_history:
  qdrant_data:
  falkordb_data:

networks:
  mem0_network:
    driver: bridge
